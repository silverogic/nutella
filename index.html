<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Text Editor GUI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Local CSS -->
  <link rel="stylesheet" href="./public/css/style.css">

  <!-- Local Vendor Scripts -->
  <script src="./public/vendor/pdf.min.js"></script>
  <script src="./public/vendor/pdf-lib.min.js"></script>
  <script src="./public/vendor/fontkit.umd.min.js"></script>
  <script src="./public/vendor/lucide.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header Toolbar -->
    <header class="header-toolbar glass-panel" role="toolbar" aria-label="Main PDF Editor Toolbar">
      <div class="logo-section">
        <div class="logo-badge" aria-hidden="true">
          <i data-lucide="file-text"></i>
        </div>
        <div class="logo-text-wrap">
          <h1 class="app-title" data-i18n="appTitle">PDF Text Editor GUI</h1>
        </div>
      </div>

      <!-- Center Controls -->
      <div class="toolbar-group">
        <button id="btnOpen" class="btn btn-secondary" aria-label="Open PDF">
          <i data-lucide="folder-open" aria-hidden="true"></i>
          <span class="btn-text" data-i18n="openPdf">PDF 열기</span>
        </button>
        <button id="btnSample" class="btn btn-secondary" data-i18n-title="samplePdfTooltip" title="샘플 PDF 문서로 테스트" aria-label="Load Sample PDF">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span class="btn-text" data-i18n="samplePdf">샘플 PDF</span>
        </button>
        <input type="file" id="filePicker" accept="application/pdf" style="display: none;" aria-label="Choose PDF File">
      </div>

      <div class="toolbar-group">
        <button id="btnToolSelect" class="btn btn-active" data-i18n-title="toolSelectTooltip" title="텍스트 선택 및 편집 모드" aria-label="Edit Text Mode">
          <i data-lucide="mouse-pointer" aria-hidden="true"></i>
          <span class="btn-text" data-i18n="toolSelect">글자 편집</span>
        </button>
        <button id="btnAddText" class="btn" data-i18n-title="addTextTooltip" title="새 텍스트 상자 추가" aria-label="Add Text Box">
          <i data-lucide="type" aria-hidden="true"></i>
          <span class="btn-text" data-i18n="addText">+ 텍스트 추가</span>
        </button>
      </div>

      <!-- Page Nav Controls -->
      <div class="toolbar-group page-nav-controls" role="navigation" aria-label="Page Navigation">
        <button id="btnPrevPage" class="btn btn-icon-only" aria-label="Previous Page" title="Previous Page">
          <i data-lucide="chevron-left" aria-hidden="true"></i>
        </button>
        <input type="number" id="inputPageNum" class="page-input" value="1" min="1" aria-label="Current Page Number">
        <span id="totalPages" aria-label="Total Pages">/ 1</span>
        <button id="btnNextPage" class="btn btn-icon-only" aria-label="Next Page" title="Next Page">
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Zoom Controls -->
      <div class="toolbar-group" role="group" aria-label="Zoom Controls">
        <button id="btnZoomOut" class="btn btn-icon-only" data-i18n-title="zoomOut" title="축소" aria-label="Zoom Out">
          <i data-lucide="zoom-out" aria-hidden="true"></i>
        </button>
        <span id="zoomVal" style="font-family: 'JetBrains Mono'; font-size: 0.85rem; min-width: 48px; text-align: center;" aria-live="polite">120%</span>
        <button id="btnZoomIn" class="btn btn-icon-only" data-i18n-title="zoomIn" title="확대" aria-label="Zoom In">
          <i data-lucide="zoom-in" aria-hidden="true"></i>
        </button>
        <button id="btnZoomReset" class="btn btn-icon-only" data-i18n-title="zoomReset" title="기본 크기" aria-label="Reset Zoom">
          <i data-lucide="rotate-ccw" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Language Toggle & Export -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="btnLangToggle" class="btn btn-secondary" title="Switch Language / 언어 전환" aria-label="Switch Language">
          <i data-lucide="languages" aria-hidden="true"></i>
          <span id="langToggleLabel">KO</span>
        </button>
        <button id="btnExport" class="btn btn-primary" aria-label="Export PDF">
          <i data-lucide="download" aria-hidden="true"></i>
          <span class="btn-text" data-i18n="exportPdf">PDF 저장 (Export)</span>
        </button>
      </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Drag & Drop Landing Overlay -->
      <div id="emptyLanding" class="empty-landing">
        <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="PDF drop zone">
          <div class="drop-icon-wrapper" aria-hidden="true">
            <i data-lucide="file-up" style="width: 36px; height: 36px;"></i>
          </div>
          <div class="drop-title" data-i18n="dropTitle">편집할 PDF 파일을 마우스로 끌어오세요</div>
          <div class="drop-desc" data-i18n="dropDesc">또는 버튼을 눌러 PDF 파일을 선택하시거나, 바로 샘플 PDF로 편집을 체험해보실 수 있습니다.</div>
          <div style="display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; justify-content: center;">
            <button class="btn btn-primary" onclick="document.getElementById('filePicker').click()">
              <i data-lucide="folder-open" aria-hidden="true"></i>
              <span data-i18n="selectFile">내 컴퓨터에서 선택</span>
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('btnSample').click()">
              <i data-lucide="sparkles" aria-hidden="true"></i>
              <span data-i18n="testSample">샘플 PDF로 테스트</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Left Sidebar Thumbnails -->
      <aside id="sidebar" class="sidebar collapsed" aria-label="Page Thumbnails">
        <div class="sidebar-header">
          <span data-i18n="pageList">페이지 목록</span>
          <i data-lucide="layers" style="width: 16px; height: 16px;" aria-hidden="true"></i>
        </div>
        <div id="thumbnailList" class="thumbnail-list"></div>
      </aside>

      <!-- Main Workspace -->
      <main class="workspace-viewport" id="workspaceViewport" tabindex="0" aria-label="PDF Workspace Canvas">
        <div id="pageContainer" class="page-container">
          <canvas id="pdfCanvas" class="pdf-canvas"></canvas>
          <div id="textOverlayLayer" class="text-overlay-layer"></div>
        </div>
      </main>

      <!-- Right Property Inspector Panel -->
      <aside id="inspectorPanel" class="inspector-panel" aria-label="Text Property Inspector">
        <div class="inspector-header">
          <span data-i18n="inspectorTitle">텍스트 속성 설정</span>
          <i data-lucide="sliders" style="width: 16px; height: 16px;" aria-hidden="true"></i>
        </div>
        <div class="inspector-body">
          <div id="selectedInfo" style="font-size: 0.75rem; color: var(--text-dim); font-family: 'JetBrains Mono';" data-i18n="noSelectedText">
            선택된 텍스트가 없습니다. PDF 상의 글자를 클릭하세요.
          </div>

          <div class="form-group">
            <label class="form-label" for="inpBlockText" data-i18n="textContentLabel">텍스트 내용 수정</label>
            <textarea id="inpBlockText" class="form-textarea" data-i18n-placeholder="textPlaceholder" placeholder="글자 내용을 입력하세요..." disabled></textarea>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label" for="inpFontSize" data-i18n="fontSizeLabel">글자 크기 (Font Size)</label>
              <span id="valFontSize" style="font-size: 0.8rem; font-family: 'JetBrains Mono'; color: var(--accent-cyan);">16px</span>
            </div>
            <input type="range" id="inpFontSize" min="8" max="72" value="16" disabled style="accent-color: var(--accent-primary);">
          </div>

          <div class="form-group">
            <label class="form-label" for="inpTextColor" data-i18n="textColorLabel">글자 색상 (Text Color)</label>
            <div class="color-picker-row">
              <input type="color" id="inpTextColor" class="color-swatch-input" value="#000000" disabled aria-label="Select text color">
              <div class="swatch-grid">
                <button class="swatch-btn" style="background: #000000;" aria-label="Color Black" onclick="document.getElementById('inpTextColor').value='#000000'; document.getElementById('inpTextColor').dispatchEvent(new Event('input'))"></button>
                <button class="swatch-btn" style="background: #4f46e5;" aria-label="Color Indigo" onclick="document.getElementById('inpTextColor').value='#4f46e5'; document.getElementById('inpTextColor').dispatchEvent(new Event('input'))"></button>
                <button class="swatch-btn" style="background: #ef4444;" aria-label="Color Red" onclick="document.getElementById('inpTextColor').value='#ef4444'; document.getElementById('inpTextColor').dispatchEvent(new Event('input'))"></button>
                <button class="swatch-btn" style="background: #10b981;" aria-label="Color Green" onclick="document.getElementById('inpTextColor').value='#10b981'; document.getElementById('inpTextColor').dispatchEvent(new Event('input'))"></button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" data-i18n="maskLabel">기존 글자 덮어쓰기 (Whiteout Mask)</label>
            <div style="display: flex; align-items: center; gap: 10px;">
              <input type="checkbox" id="chkMaskOriginal" checked disabled style="width: 18px; height: 18px; accent-color: var(--accent-primary);" aria-label="Enable Whiteout Mask">
              <span style="font-size: 0.85rem; color: var(--text-muted);" data-i18n="maskCheckbox">기존 글자 배경 덮어쓰기</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="inpBgColor" data-i18n="bgColorLabel">마스크 배경색 (Background Color)</label>
            <input type="color" id="inpBgColor" class="color-swatch-input" value="#ffffff" disabled aria-label="Select mask background color">
          </div>

          <hr style="border: none; border-top: 1px solid var(--border-light); margin: 8px 0;">

          <button id="btnDeleteBlock" class="btn btn-secondary" style="color: #f87171; border-color: rgba(239, 68, 68, 0.3);" disabled>
            <i data-lucide="trash-2" aria-hidden="true"></i>
            <span data-i18n="deleteBlock">텍스트 항목 삭제</span>
          </button>
        </div>
      </aside>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
